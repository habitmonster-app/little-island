name: 앱 빌드 (APK)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 만들기
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 폰에서 받을 수 있게 릴리스로 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk little-island.apk
          gh release create "build-${{ github.run_number }}" little-island.apk \
            --title "작은 섬 테스트 빌드 ${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }}" \
            --latest
