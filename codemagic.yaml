workflows:
  android-debug:
    name: 작은 섬 테스트 APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: APK 만들기
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
